<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura - Bienestar Emocional</title>
    <meta
      name="description"
      content="Aura - Plataforma de Bienestar con Inteligencia Artificial"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/x-icon" href="/assets/logo.ico" />
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main id="app">
      <!-- Views will be injected here -->
      <div style="text-align: center">Cargando Aura...</div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js" integrity="sha384-KNaFJ+EK516RuHsoycvreec5pD7BkTKJEkjMrVSQWu9KGTl7En4dhIDv7t1DFJ+g" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js" integrity="sha384-vxxMdt1K6XlME6zkLsgFrrHIeC7XIdAo1GW/uhhObjJXnymxiIi/eoMXsKJA13ZJ" crossorigin="anonymous"></script>

    <script>
      async function loadAssets() {
        console.log("Loading assets...");
        try {
          const res = await fetch('/version.json?t=' + Date.now());
          if (!res.ok) throw new Error("Could not fetch version.json");
          const { version: v } = await res.json();
          console.log("App Version:", v);

          // Styles
          [
            '/styles.css',
            '/login-register/login-register.css',
            '/dashboard/student-dashboard.css'
          ].forEach(href => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href + '?v=' + v;
            document.head.appendChild(link);
          });

          // Scripts (Maintaining Order)
          const scripts = [
            '/navbar.js',
            '/footer.js',
            '/config.js',
            '/login-register/auth.js',
            '/hcpro/hcpro-registration.js',
            '/hcpro/hcpro-dashboard.js',
            '/login-register/camera-handler.js',
            '/login-register/user-views.js',
            '/dashboard/student-dashboard.js',
            '/dashboard/emotion-views.js',
            '/dashboard/survey-manager.js',
            '/dashboard/survey-view.js',
            '/dashboard/profile-view.js',
            '/admin/admin-dashboard.js',
            '/admin/admin-reports.js',
            '/admin/admin-users.js',
            '/app.js'
          ];

          for (const src of scripts) {
            await new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = src + '?v=' + v;
              s.onload = () => {
                console.log(`Loaded: ${src}`);
                resolve();
              };
              s.onerror = () => {
                console.error(`Failed to load: ${src}`);
                reject();
              };
              document.head.appendChild(s);
            });
          }
          console.log("All assets loaded successfully.");
        } catch (e) {
          console.error("Critical error loading assets:", e);
          // Fallback or alert could be added here
        }
      }
      loadAssets();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        const registerSW = () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .catch((err) => console.log("SW registration failed: ", err));
        };

        if (document.readyState === 'complete') {
          registerSW();
        } else {
          window.addEventListener("load", registerSW);
        }
      }
    </script>
  </body>
</html>
